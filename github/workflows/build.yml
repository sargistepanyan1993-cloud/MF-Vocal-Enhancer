name: Build MF Vocal Enhancer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      - name: Configure project
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build VST3
        run: cmake --build build --config Release --parallel 3

      - name: Upload VST3 plugin
        uses: actions/upload-artifact@v4
        with:
          name: MF-Vocal-Enhancer-VST3
          path: build/MFProductionVocalEnhancer_artefacts/Release/VST3/*.vst3
